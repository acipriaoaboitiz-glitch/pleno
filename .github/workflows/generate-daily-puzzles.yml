name: Generate daily football puzzles

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-puzzle-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run puzzle and scoring tests
        run: node --test tests/daily-games.test.mjs tests/wikidata-puzzle-catalog.test.mjs tests/scoring.test.cjs
      - name: Generate from Wikidata and publish the 60-day reserve
        env:
          PUZZLE_SEED_SECRET: ${{ secrets.PUZZLE_SEED_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node tools/generate-wikidata-puzzles.mjs
